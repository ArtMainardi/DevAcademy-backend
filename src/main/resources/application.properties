
# ==========================================
# CONFIGURAÇÕES GERAIS
# ==========================================

spring.application.name=trabalho

server.port=8080


# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS H2
# ==========================================

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:plataforma_db

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# CONFIGURAÇÃO JPA / HIBERNATE
# ==========================================

# Atualiza a estrutura do banco conforme as entidades
spring.jpa.hibernate.ddl-auto=update

# Exibe comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos
spring.jpa.properties.hibernate.format_sql=true

# Evita execução de SQL durante a inicialização da view
spring.jpa.open-in-view=false


# ==========================================
# CONSOLE H2
# ==========================================

# Habilita o console web do H2
spring.h2.console.enabled=true

# Endereço para acessar o console
spring.h2.console.path=/h2-console


# ==========================================
# CONFIGURAÇÃO DE LOG
# ==========================================

# Exibe informações sobre as consultas SQL
logging.level.org.hibernate.SQL=DEBUG

# Exibe parâmetros utilizados nas consultas
logging.level.org.hibernate.orm.jdbc.bind=TRACE
